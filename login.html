<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inkwell – Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body data-page="login">
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">Ink<span>well</span></a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">☰</button>
      <ul class="nav-links" id="nav-links"></ul>
    </div>
  </header>

  <main class="container auth-wrap">
    <form class="form-card" id="login-form" novalidate>
      <h1>Welcome back</h1>
      <p class="sub">Log in to manage your blogs.</p>
      <div class="alert" id="alert" role="alert"></div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
        <div class="error"></div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
        <div class="error"></div>
      </div>
      <button class="btn btn-block" type="submit">Login</button>
      <p class="form-foot">New here? <a href="register.html">Create an account</a></p>
    </form>
  </main>

  <footer>© 2026 Inkwell · Module 1 Frontend Project</footer>
</body>
</html>
