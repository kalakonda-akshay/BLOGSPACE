<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inkwell – Register</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body data-page="register">
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">Ink<span>well</span></a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">☰</button>
      <ul class="nav-links" id="nav-links"></ul>
    </div>
  </header>

  <main class="container auth-wrap">
    <form class="form-card" id="register-form" novalidate>
      <h1>Create account</h1>
      <p class="sub">Join Inkwell and publish your first post.</p>
      <div class="alert" id="alert" role="alert"></div>

      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="Your name" autocomplete="name">
        <div class="error"></div>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
        <div class="error"></div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password">
        <div class="error"></div>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" name="confirm" placeholder="Repeat password" autocomplete="new-password">
        <div class="error"></div>
      </div>
      <button class="btn btn-block" type="submit">Register</button>
      <p class="form-foot">Already have an account? <a href="login.html">Login</a></p>
    </form>
  </main>

  <footer>© 2026 Inkwell · Module 1 Frontend Project</footer>
</body>
</html>
